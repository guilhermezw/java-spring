spring:
  application:
    name: keycloak

  datasource:
    url: jdbc:mysql://localhost:3306/db
    username: root
    password: db
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/keycloak
logging:
  level:
    org.springframework.security: DEBUG